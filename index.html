let lastBubbleTime = 0;

function formatAmount(amount) {
  let str = amount.toFixed(2);   // always 2 decimals initially
  str = str.replace(/\.?0+$/, '');  // remove trailing zeros and optional dot if nothing after
  return str;
}

function createBubble(amount) {
  const now = Date.now();
  if (now - lastBubbleTime < 400) return;
  lastBubbleTime = now;

  const bubble = document.createElement('div');
  bubble.classList.add('bubble');

  const size = Math.max(60, Math.log10(amount + 1) * 150);

  bubble.style.width = `${size}px`;
  bubble.style.height = `${size}px`;

  const minFontSize = 18;
  bubble.style.fontSize = `${Math.max(size / 10, minFontSize)}px`;
  bubble.style.color = '#fff';  // white text for better visibility
  bubble.style.webkitTextStroke = '0.3px black'; // thin black outline


  const container = document.getElementById('container');
  const startX = Math.random() * (container.offsetWidth * 0.8) + (container.offsetWidth * 0.1);
  bubble.style.left = `${startX}px`;
  // Randomly pick a direction and magnitude
const driftDirection = Math.random() < 0.5 ? -1 : 1;
const driftMagnitude = Math.random() * 200 + 50; // between 50 and 250 px
const driftAmount = driftDirection * driftMagnitude;


  // Duration: Bigger bubbles = slower speed
  // Inverse relation: larger size → longer duration
  // Normalize: base duration around size
  const baseSpeed = 0.003; // smaller is slower overall
  const duration = size / baseSpeed; // milliseconds
  console.log(`Bubble size: ${size}px, duration: ${duration}ms`);

const keyframes = [
  {
    transform: 'translate(0, 0) scale(1)',
    opacity: 1
  },
  {
    transform: `translate(${driftAmount}px, -100vh) scale(1.1)`,
    opacity: 1
  }
];



  const options = {
    duration: duration,
    easing: 'cubic-bezier(0.2, 0.8, 0.4, 1)',
    fill: 'forwards'
  };

  const animation = bubble.animate(keyframes, options);

  animation.onfinish = () => {
    bubble.remove();
  };

  animation.oncancel = () => {
    console.warn("Animation canceled prematurely!");
  };

  const displayAmount = showUSD && lastCatcoinPrice ? amount * lastCatcoinPrice : amount;
  const unitLabel = showUSD && lastCatcoinPrice ? 'USD' : 'CAT';
  bubble.textContent = `${formatAmount(displayAmount)} ${unitLabel}`;
  container.appendChild(bubble);

  playBubbleSound();

}

function playBubbleSound() {
  const sound = bubblePopSound.cloneNode(); // create a new copy of the audio element
  sound.volume = bubblePopSound.volume;     // keep the same volume level
  sound.play().catch((e) => {
    // Ignore or log play errors (e.g., if user hasn't interacted yet)
    console.warn('Bubble sound play failed:', e);
  });
}

  function connectWebSocket() {
    ws = new WebSocket(window.location.hostname === 'localhost' ? 'ws://localhost:8765' : 'wss://' + window.location.host + '/ws');
    updateConnectionUI('connecting');

    ws.onopen = () => {

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

  const amount = data.amount ? data.amount.toFixed(5) : 'N/A';
  const txid = data.txid || 'Unknown TXID';
  const dateStr = data.timestamp ? new Date(data.timestamp).toLocaleString() : 'Unknown date';

  const logLine = `[${dateStr}] TX ID: ${txid} Amount: ${amount} CAT`;

  txLog.push(logLine);
  if (txLog.length > maxLogSize) {
    txLog.shift();
  }
  if (data.amount) createBubble(data.amount);
};



    ws.onerror = () => {

      updateConnectionUI('disconnected');
    };

    ws.onclose = () => {

      updateConnectionUI('disconnected');

  function updateConnectionUI(state) {
  connectionBtn.classList.remove('connected', 'disconnected');
  if (state === 'connected') {
    connectionBtn.classList.add('connected');

  } else if (state === 'connecting') {
    connectionBtn.classList.add('disconnected');

  } else {
    connectionBtn.classList.add('disconnected');
    connectionBtn.innerHTML = '<span id="statusText">Disconnected</span> (Click to Reconnect)';
  }
}

async function fetchCatcoinPrice() {
  try {
    const response = await fetch(
      'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=catcoin&price_change_percentage=24h,7d,30d'
    );
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const data = await response.json();
    if (data.length === 0) {
      // If we get empty response but no error, use last price
      if (lastCatcoinPrice) {
        console.warn('Empty response from Coingecko, using last known price');
        return;
      }
      throw new Error('Empty response from Coingecko');
    }

    const coin = data[0];
    const price = coin.current_price;
    const change24h = coin.price_change_percentage_24h_in_currency;
    const change7d = coin.price_change_percentage_7d_in_currency;
    const change30d = coin.price_change_percentage_30d_in_currency;

    // Only update if we got valid numbers
    if (!isNaN(price)) {
      document.getElementById('cat-price').textContent = `$${price.toFixed(3)}`;
      lastCatcoinPrice = price;
    }

    if (!isNaN(change24h)) updateChangeDisplay('change-24h', change24h);
    if (!isNaN(change7d)) updateChangeDisplay('change-7d', change7d);
    if (!isNaN(change30d)) updateChangeDisplay('change-30d', change30d);

  } catch (e) {
    console.error('Failed to fetch Catcoin price:', e.message);
    // If we have a previous price, keep showing it
    if (lastCatcoinPrice) {
      document.getElementById('cat-price').textContent = `$${lastCatcoinPrice.toFixed(3)}`;
      console.log('Using last known price due to API error');
    } else {
      document.getElementById('cat-price').textContent = '--';
    }
  }
}

}

function updateMinAmount() {

  // Update active label styling
  amountLabels.forEach(label => {
    label.classList.remove('active');
    if (parseInt(label.textContent) === minAmount) {
      label.classList.add('active');
    }
  });
  
  // Store in localStorage
  localStorage.setItem('minCatAmount', minAmount);
}

  const savedAmount = parseFloat(localStorage.getItem('minCatAmount'));
  // Find which position corresponds to this value
  for (let pos in positionToValue) {
    if (positionToValue[pos] === savedAmount) {
      minAmountSlider.value = pos;
      break;
    }
  }
}

// THEME TOGGLE - Replace your current toggleTheme function
function toggleTheme() {
  const body = document.body;
  const isDark = !body.classList.contains('dark-mode');
  
  // Disable interactions during transition
  body.style.pointerEvents = 'none';
  body.classList.add('theme-transition');
  
  // Pause bubble animations during transition
  document.querySelectorAll('.bubble').forEach(bubble => {
    bubble.style.animationPlayState = 'paused';
  });

  requestAnimationFrame(() => {
    body.classList.toggle('dark-mode', isDark);
    document.querySelector('.theme-text').textContent = isDark ? "Light Mode" : "Dark Mode";
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    
    setTimeout(() => {
      body.classList.remove('theme-transition');
      body.style.pointerEvents = 'auto';
      // Resume bubble animations
      document.querySelectorAll('.bubble').forEach(bubble => {
        bubble.style.animationPlayState = 'running';
      });
    }, 300);
  });
}

// INITIALIZE THEME - Add this where you initialize your app
function initTheme() {
  preloadThemeImages();
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    document.querySelector('.theme-text').textContent = "Light Mode";
  } else {
    document.body.classList.add('light-mode');
  }
}
